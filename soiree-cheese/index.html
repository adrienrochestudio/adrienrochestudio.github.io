<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soirée cheese</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F1E1">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main id="accueil" class="ecran" hidden>
  <header class="tete">
    <h1>Soirée cheese</h1>
    <img class="souris" src="./petite-souris.png" alt="" width="300" height="226">
  </header>

  <section class="partie" aria-labelledby="titre-degustation">
    <h2 id="titre-degustation">Dégustation</h2>
    <div class="grille" id="grille-degustation"></div>
  </section>

  <section class="partie" aria-labelledby="titre-trivia">
    <h2 id="titre-trivia">Trivia</h2>
    <ol class="legende" id="legende"></ol>
    <div class="grille" id="grille-trivia"></div>
  </section>

  <p class="installer" id="installer" hidden>Pour l'installer sur l'iPhone : Partager, puis Sur l'écran d'accueil.</p>
  <button type="button" class="lien" id="remise-a-zero">Tout remettre à zéro</button>
  <p class="erreur" id="erreur" hidden></p>
</main>

<div id="carte" class="ecran ecran-carte" hidden>
  <nav class="barre">
    <button type="button" class="lien" id="retour">Accueil</button>
    <span class="position" id="position"></span>
  </nav>
  <div class="selecteur" id="selecteur" role="group" aria-label="Profil">
    <button type="button" data-profil="adrien">Adrien</button>
    <button type="button" data-profil="ana">Ana</button>
    <button type="button" data-profil="deux">Les deux</button>
  </div>
  <article class="contenu" id="contenu"></article>
  <nav class="pied">
    <button type="button" class="bouton secondaire" id="precedente">Précédente</button>
    <button type="button" class="bouton secondaire" id="suivante">Suivante</button>
  </nav>
</div>

<div id="profil" class="voile voile-bas" hidden>
  <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="profil-titre">
    <p class="feuille-titre" id="profil-titre">Qui joue cette carte ?</p>
    <button type="button" class="bouton" data-profil="adrien">Adrien</button>
    <button type="button" class="bouton" data-profil="ana">Ana</button>
    <button type="button" class="bouton" data-profil="deux">Les deux</button>
    <button type="button" class="lien" id="profil-annuler">Annuler</button>
  </div>
</div>

<div id="maj" class="maj" hidden>
  <span>Nouvelle version disponible.</span>
  <button type="button" class="lien" id="maj-recharger">Recharger</button>
</div>
<div id="ptr" aria-hidden="true"><span>Relâcher pour recharger</span></div>
<script src="./rafraichir.js"></script>
</body>
</html>
